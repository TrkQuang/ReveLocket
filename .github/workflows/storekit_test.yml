name: StoreKit 2 & RevenueCat Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  revenuecat-test:
    name: RevenueCat & StoreKit Verification (Ubuntu)
    runs-on: ubuntu-latest # Hoạt động miễn phí 100% trên Private Repo mà không cần thẻ visa

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate StoreKit Configuration Files
        run: |
          echo "=== KIỂM TRA FILE STOREKIT ==="
          ls -la *.storekit
          cat LocketGold.storekit | head -n 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run RevenueCat Test Runner
        run: python run_simulation.py

      - name: Display Test Results (kq.txt)
        run: |
          echo "=== KẾT QUẢ TỪ FILE KQ.TXT ==="
          cat kq.txt

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: revelocket-test-results
          path: kq.txt
