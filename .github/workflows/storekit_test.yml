name: RevenueCat Test Store CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  revenuecat-test-store-ci:
    name: RevenueCat Test Store CI (Automated Test Mode)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Swift Syntax
        run: |
          echo "=== KIỂM TRA SYNTAX SWIFT ==="
          swiftc -parse MasterKeyManager.swift

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run RevenueCat Test Store Flow & Validation
        env:
          CURRENT_UID: "kqdepzai"
        run: python run_simulation.py

      - name: Display CI Verification Results
        run: |
          echo "================================================================================"
          echo "KẾT QUẢ TỪ FILE KQ.TXT (REVENUECAT TEST STORE CI)"
          echo "================================================================================"
          cat kq.txt

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: revelocket-test-store-ci
          path: kq.txt
