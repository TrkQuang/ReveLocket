name: Apple StoreKit 2 & RevenueCat CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  storekit-appstore-ci:
    name: Apple StoreKit & RevenueCat CI (macOS)
    runs-on: macos-latest # Chạy trực tiếp trên macOS theo yêu cầu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify macOS & Xcode Environment
        run: |
          echo "=== THÔNG TIN MÔI TRƯỜNG MACOS ==="
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate StoreKit Configuration Files
        run: |
          echo "=== KIỂM TRA FILE CẤU HÌNH STOREKIT ==="
          ls -la *.storekit
          plutil -lint LocketGold.storekit
          plutil -lint Products.storekit

      - name: Validate Swift Syntax
        run: |
          echo "=== KIỂM TRA SYNTAX SWIFT ==="
          swiftc -parse MasterKeyManager.swift

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Apple App Store Config & Verification (Read-Only)
        run: python run_simulation.py

      - name: Display CI Verification Results
        run: |
          echo "================================================================================"
          echo "KẾT QUẢ TỪ FILE KQ.TXT (CI MODE)"
          echo "================================================================================"
          cat kq.txt

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: revelocket-app-store-ci
          path: kq.txt
