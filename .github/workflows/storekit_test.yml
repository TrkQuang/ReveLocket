name: Xcode Local StoreKit + RevenueCat CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  local-storekit-revenuecat-ci:
    name: Xcode Local StoreKit + RevenueCat Audit
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Swift Syntax
        run: |
          echo "=== KIỂM TRA SYNTAX SWIFT ==="
          swiftc -parse MasterKeyManager.swift

      - name: Validate Local StoreKit Configuration File
        run: |
          echo "=== KIỂM TRA FILE LocketGold.storekit ==="
          test -f LocketGold.storekit || (echo "LocketGold.storekit missing" && exit 1)
          grep -q "locket_1600_1y" LocketGold.storekit || (echo "Product locket_1600_1y missing" && exit 1)
          echo "✅ File LocketGold.storekit hợp lệ."

      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Xcode Local StoreKit & RevenueCat Audit
        env:
          CURRENT_UID: "kqdepzai"
        run: python run_simulation.py

      - name: Display CI Verification Results
        run: |
          echo "================================================================================"
          echo "KẾT QUẢ TỪ FILE KQ.TXT (XCODE LOCAL STOREKIT + REVENUECAT AUDIT)"
          echo "================================================================================"
          cat kq.txt

      - name: Upload CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: revelocket-local-storekit-ci
          path: kq.txt
